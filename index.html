<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clawd — montage d'entraînement (30 s, 100 % code)</title>
<meta name="description" content="Animation de 30 secondes generee entierement en code : canvas 2D pour l'image, Web Audio API pour la musique. Aucune image, aucun sample.">
<style>
  :root { --terra:#D97757; --cream:#F4ECE2; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#08090C; color:var(--cream);
    font-family:Inter,"Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  #wrap { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16/9;
    box-shadow:0 30px 120px rgba(0,0,0,.8); background:#000; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:22px; background:radial-gradient(circle at 50% 45%, rgba(217,119,87,.10), rgba(4,4,6,.86) 70%);
    backdrop-filter:blur(2px); transition:opacity .5s ease, visibility .5s; }
  #overlay.hidden { opacity:0; visibility:hidden; }
  #playBtn { cursor:pointer; border:none; background:none; display:flex; flex-direction:column;
    align-items:center; gap:16px; color:var(--cream); font:inherit; }
  .ring { width:104px; height:104px; border-radius:50%; border:2px solid rgba(217,119,87,.75);
    display:flex; align-items:center; justify-content:center; transition:transform .25s ease, box-shadow .25s ease;
    box-shadow:0 0 44px rgba(217,119,87,.28) inset; }
  #playBtn:hover .ring { transform:scale(1.07); box-shadow:0 0 70px rgba(217,119,87,.45) inset; }
  .tri { width:0; height:0; margin-left:7px; border-left:26px solid var(--terra);
    border-top:16px solid transparent; border-bottom:16px solid transparent; }
  #playLabel { letter-spacing:.42em; text-transform:uppercase; font-size:13px; opacity:.85; }
  h1 { margin:0; font-weight:300; font-size:clamp(20px,2.5vw,38px); letter-spacing:.02em; text-align:center; }
  h1 b { color:var(--terra); font-weight:600; }
  p.sub { margin:0; max-width:560px; text-align:center; font-size:clamp(11px,1.05vw,15px);
    line-height:1.6; opacity:.62; }
  footer { position:absolute; bottom:18px; left:0; right:0; text-align:center; font-size:11px;
    letter-spacing:.22em; text-transform:uppercase; opacity:.35; }
  @media (max-width:640px){ .ring{width:80px;height:80px} .tri{border-left-width:20px} }
</style>
</head>
<body>
<div id="wrap">
  <div id="frame">
    <canvas id="stage" width="1920" height="1080"></canvas>
    <div id="overlay">
      <h1>Clawd — <b>30 secondes</b>, 100 % code</h1>
      <button id="playBtn" aria-label="Lancer l'animation avec le son">
        <span class="ring"><span class="tri"></span></span>
        <span id="playLabel">lancer</span>
      </button>
      <p class="sub">Image : canvas 2D, image par image. Musique : synthèse Web Audio (cordes, piano, taiko).
        Aucune image externe, aucun sample, aucune IA générative dans le rendu. Le son démarre au clic.</p>
      <footer>canvas 2d · web audio api · 1920×1080 · 60 fps</footer>
    </div>
  </div>
</div>
<script src="src/music.js?v=1790244096"></script>
<script src="src/core.js?v=1790244096"></script>
<script src="src/scenes.js?v=1790244096"></script>
<script src="src/main.js?v=1790244096"></script>
</body>
</html>
